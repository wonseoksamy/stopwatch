<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>테란 · 스탑워치</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --grn:#6dff7a; --amber:#ffa800; --red:#ff3b30; --txt:#e7efe9; --dim:#7f948a; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000}
  body{display:flex;align-items:center;justify-content:center;color:var(--txt);overflow:hidden;font-family:"Noto Sans KR","Malgun Gothic",system-ui,sans-serif}

  .screen{container-type:inline-size;width:min(100vw,calc(100vh * 640 / 480),1000px);position:relative;background:#000;box-shadow:0 0 0 1px #111,0 20px 80px rgba(0,0,0,.9)}

  /* ================= VIEW ================= */
  .view{position:relative;aspect-ratio:640/338;overflow:hidden;background:#0c0d0f}
  .view>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
  .grain{position:absolute;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>");animation:grain .6s steps(3) infinite}
  @keyframes grain{0%{background-position:0 0}33%{background-position:-30px 18px}66%{background-position:22px -26px}100%{background-position:0 0}}
  .flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
  .bar{position:absolute;left:0;right:0;background:#000;pointer-events:none;height:0}
  .bar.t{top:0}.bar.b{bottom:0}

  .clock{position:absolute;top:.6cqw;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
  .time{font-family:Oxanium,sans-serif;font-weight:800;font-size:5.4cqw;line-height:1;letter-spacing:.01em;font-variant-numeric:tabular-nums;
    display:flex;align-items:baseline;justify-content:center;white-space:nowrap;color:#9dff9d;text-shadow:0 0 .8cqw rgba(109,255,122,.55),0 .15cqw .3cqw #000}
  .time .cs{font-weight:600;font-size:.46em;margin-left:.18em;color:#ffd35c;text-shadow:0 .1cqw .2cqw #000}
  .time .hr{color:#58a863}
  .hud-l{position:absolute;top:.8cqw;left:1.2cqw;font-size:1.7cqw;font-weight:500;color:#ffe08a;text-shadow:0 1px 2px #000;letter-spacing:.04em}
  .hud-l b{color:#9dff9d;font-weight:700;font-family:Oxanium}
  .res{position:absolute;top:.5cqw;right:1.2cqw;display:flex;gap:2.2cqw;font-family:Oxanium,sans-serif;font-weight:600;font-size:2.1cqw;font-variant-numeric:tabular-nums;text-shadow:0 1px 2px #000}
  .res span{display:flex;align-items:center;gap:.5cqw}
  .res svg{width:2.1cqw;height:2.1cqw}
  #min{color:#59c7ff}#gas{color:#6dff7a}#sup{color:#59c7ff}
  .res .block #sup{color:var(--red)}

  .msgs{position:absolute;left:1.2cqw;bottom:7cqw;font-size:1.8cqw;line-height:1.45;text-shadow:0 1px 2px #000,0 0 5px #000;pointer-events:none;max-width:70%}
  .msgs div{color:#ffe34a;animation:msg 8s forwards}
  .msgs div i{font-style:normal;color:#9aeaff;font-family:Oxanium}
  @keyframes msg{0%,82%{opacity:1}100%{opacity:0}}
  .alert{position:absolute;top:11cqw;left:0;right:0;text-align:center;font-weight:700;letter-spacing:.24em;font-size:3cqw;color:#fff1a8;opacity:0;pointer-events:none;text-shadow:0 0 14px rgba(255,168,0,.75),0 2px 3px #000;padding-left:.24em}
  .alert.show{animation:alert 2.2s ease-out}
  @keyframes alert{0%{opacity:0;transform:scale(1.15)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
  .title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;text-shadow:0 2px 12px #000}
  .title small{font-family:Oxanium;font-weight:600;font-size:1.9cqw;letter-spacing:.7em;color:#ffa800;padding-left:.7em}
  .title b{font-size:6.2cqw;font-weight:700;letter-spacing:.18em;margin-top:.8cqw;color:#f3f6f2;padding-left:.18em}
  .title i{font-style:normal;font-size:1.8cqw;color:#9fb3a6;letter-spacing:.3em;margin-top:1cqw;padding-left:.3em}

  .solid .ft{fill:url(#fT)} .solid .fl{fill:url(#fL)} .solid .fr{fill:url(#fR)}
  .solid polygon,.solid rect,.solid path,.solid ellipse{stroke:#05080c;stroke-width:.7;stroke-linejoin:round}
  .solid .lit{fill:#ffc24a;stroke:none;filter:url(#glow)} .solid .dk{fill:#0a1016} .solid .acc{fill:#27506d} .solid .pad{fill:#1c2a36}
  .solid .tc{fill:#2f6dff;stroke:none} .solid .haz{fill:url(#haz);stroke:none}
  .wire *{fill:rgba(78,201,255,.08)!important;stroke:#4ec9ff;stroke-width:1.1}
  .ghost .gr{fill:url(#pg);stroke:none;opacity:0}
  .ghost .ge{fill:none;stroke:#6dff7a;stroke-width:1.6;opacity:0;filter:url(#glow)}
  .ghost.up .gr{opacity:.6} .ghost.sel .ge{opacity:1} .ghost.sel .gr{opacity:.28}

  /* ================= CONSOLE (SC1 layout) ================= */
  .console{position:relative;aspect-ratio:640/142;display:grid;grid-template-columns:24% 40.5% 14.5% 21%;
    background:linear-gradient(180deg,#444b52 0,#2a3036 6%,#171b1f 100%);border-top:.5cqw solid #606971;box-shadow:inset 0 .25cqw 0 #8c97a0}
  .console::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
    background:
      radial-gradient(circle at 1cqw 1.2cqw,#8a97a2 .26cqw,transparent .34cqw),radial-gradient(circle at calc(100% - 1cqw) 1.2cqw,#8a97a2 .26cqw,transparent .34cqw),
      radial-gradient(circle at 1cqw calc(100% - 1.2cqw),#8a97a2 .26cqw,transparent .34cqw),radial-gradient(circle at calc(100% - 1cqw) calc(100% - 1.2cqw),#8a97a2 .26cqw,transparent .34cqw)}
  .well{position:relative;background:#020405;overflow:hidden;box-shadow:inset 0 0 1.6cqw #000,0 0 0 .26cqw #4b565f}
  .console>*{min-height:0}

  .mmwrap{display:flex;flex-direction:column;gap:.6cqw;padding:.9cqw 0 1cqw 1cqw}
  .mmbtns{display:grid;grid-template-columns:1fr 1fr;gap:.5cqw;height:3cqw}
  .mmbtns div{background:repeating-linear-gradient(135deg,#d9b400 0 .8cqw,#15130a .8cqw 1.6cqw);box-shadow:inset 0 0 0 .22cqw #5b656d}
  .mmbtns div:first-child{background:linear-gradient(180deg,#2d353b,#12171b);display:flex;align-items:center;justify-content:center}
  .mmbtns svg{width:60%;height:75%}
  .mm{flex:1;min-height:0}
  .mm svg{display:block;position:absolute;inset:0;width:100%;height:100%}

  .info{margin:1.2cqw .6cqw 1.2cqw .8cqw;display:flex;gap:1.2cqw;padding:1cqw 1.2cqw;background:#020405}
  .sel{flex:0 0 33%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.4cqw;min-width:0}
  .sel svg.big{width:100%;height:7.4cqw;filter:drop-shadow(0 0 .5cqw rgba(109,255,122,.6))}
  .sel .pw *{fill:rgba(109,255,122,.12)!important;stroke:var(--grn)!important;stroke-width:1.1;opacity:1!important}
  .sel b.hp{font-family:Oxanium;font-weight:600;font-size:1.7cqw;color:var(--grn);font-variant-numeric:tabular-nums}
  .grid{display:grid;grid-template-columns:repeat(2,4.3cqw);grid-auto-rows:4.3cqw;gap:.35cqw;align-content:center}
  .grid div{border:.26cqw solid #2f6dff;background:#030a14;display:flex;align-items:center;justify-content:center;box-shadow:0 0 .6cqw rgba(47,109,255,.45)}
  .grid svg{width:84%;height:84%}
  .grid .pw *{fill:rgba(109,255,122,.14)!important;stroke:var(--grn)!important;stroke-width:1.4}
  .nfo{flex:1;display:flex;flex-direction:column;justify-content:space-between;min-width:0}
  .nfo .nm{font-weight:700;font-size:2cqw;color:#f1f6f2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .nfo .st{font-size:1.65cqw;color:#cfe3d3;text-align:center;margin-top:-.2cqw}
  .seg{display:flex;gap:.2cqw;height:1.4cqw;padding:.15cqw;border:.2cqw solid #2c4a31;background:#030a05}
  .seg i{flex:1;background:#0b1a0e} .seg i.on{background:var(--grn);box-shadow:0 0 .5cqw rgba(109,255,122,.7)}
  .slots{display:grid;grid-template-columns:repeat(6,1fr);gap:.35cqw}
  .slots div{height:3.2cqw;display:flex;align-items:center;justify-content:center;font-family:Oxanium;font-weight:800;font-size:2.2cqw;color:#1f6b2b;background:#06100a;border:.22cqw solid #1d4a27}
  .slots div.on{color:var(--grn);border-color:var(--grn);box-shadow:0 0 .8cqw rgba(109,255,122,.55);animation:pulse 1s infinite alternate}
  .slots div.done{color:#031a08;background:#2f9a3a;border-color:#7dff8a}
  @keyframes pulse{to{background:#0d2a14}}

  .portwrap{display:flex;flex-direction:column;gap:.6cqw;padding:1cqw .4cqw 1cqw}
  .menu{height:2.7cqw;background:linear-gradient(180deg,#3a444d,#171d22);box-shadow:inset 0 0 0 .22cqw #5b6a75;display:flex;align-items:center;justify-content:center;font-size:1.7cqw;color:#e9d9a0}
  .portrait{flex:1} .portrait svg{display:block;width:100%;height:100%}

  .cmdwrap{position:relative;padding:.9cqw 1cqw .9cqw .6cqw}
  .cmd{height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:.5cqw;grid-template-areas:"go lap rst" "sfx fs x1" "x2 x3 x4"}
  .cmd button,.cmd .slot{position:relative;font:inherit;cursor:pointer;padding:0;border:0;background:#05070a;color:var(--txt);
    box-shadow:inset 0 0 0 .3cqw #3d454c,inset 0 0 0 .45cqw #0a0d10,inset 0 0 1cqw #000;transition:filter .15s,transform .08s}
  .cmd .slot{cursor:default}
  .cmd button:hover:not(:disabled){filter:brightness(1.6)}
  .cmd button:active:not(:disabled){transform:translateY(.2cqw)}
  .cmd button:disabled{opacity:.35;cursor:default}
  .cmd svg{position:absolute;left:14%;top:12%;width:72%;height:56%}
  .cmd .k{position:absolute;right:.6cqw;bottom:.25cqw;font-size:1.25cqw;font-weight:700;color:#ffa800}
  .cmd .lb{position:absolute;left:0;right:0;bottom:.25cqw;text-align:center;font-size:1.2cqw;font-weight:700;color:#cfd8cf}
  #go{grid-area:go}#lap{grid-area:lap}#rst{grid-area:rst}#sfx{grid-area:sfx}#fs{grid-area:fs}
  @media (prefers-reduced-motion:reduce){.alert.show,.msgs div,.slots div.on,.grain{animation:none}}
</style>
</head>
<body>
<div class="screen" id="screen">
  <div class="view" id="view">
    <svg viewBox="0 0 640 338" preserveAspectRatio="xMidYMid slice" id="scene" aria-label="전장">
      <defs>
        <linearGradient id="fT" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bcc9d4"/><stop offset="1" stop-color="#7f8f9e"/></linearGradient>
        <linearGradient id="fL" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d8c9a"/><stop offset="1" stop-color="#4c5a67"/></linearGradient>
        <linearGradient id="fR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f5c69"/><stop offset="1" stop-color="#2b353f"/></linearGradient>
        <radialGradient id="xg"><stop offset="0" stop-color="#fffbe0"/><stop offset=".25" stop-color="#ffd35c"/><stop offset=".55" stop-color="#ff7a1a"/><stop offset=".85" stop-color="#b3260a" stop-opacity=".7"/><stop offset="1" stop-color="#400" stop-opacity="0"/></radialGradient>
        <radialGradient id="creep"><stop offset="0" stop-color="#3a1d4a" stop-opacity=".95"/><stop offset=".6" stop-color="#4b2a5c" stop-opacity=".8"/><stop offset="1" stop-color="#4b2a5c" stop-opacity="0"/></radialGradient>
        <radialGradient id="hglow"><stop offset="0" stop-color="#ffb347" stop-opacity=".9"/><stop offset="1" stop-color="#ff6a00" stop-opacity="0"/></radialGradient>
        <pattern id="tiles" width="64" height="32" patternUnits="userSpaceOnUse"><path d="M0 16L32 0L64 16L32 32Z" fill="none" stroke="#000" stroke-opacity=".38" stroke-width="1"/></pattern>
        <pattern id="pg" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="rgba(109,255,122,.14)"/><path d="M12 0H0V12" fill="none" stroke="#6dff7a" stroke-opacity=".7"/></pattern>
        <pattern id="haz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#14120a"/><rect width="4" height="8" fill="#e0b800"/></pattern>
        <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="1.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%"><feDropShadow dx="8" dy="6" stdDeviation="3.5" flood-color="#000" flood-opacity=".6"/></filter>
        <filter id="terrain" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency=".035 .07" numOctaves="4" seed="5" result="n"/>
          <feDiffuseLighting in="n" surfaceScale="2.6" diffuseConstant="1.1" lighting-color="#a5acb4" result="lit"><feDistantLight azimuth="235" elevation="55"/></feDiffuseLighting>
          <feComponentTransfer in="lit"><feFuncR type="linear" slope=".24"/><feFuncG type="linear" slope=".25"/><feFuncB type="linear" slope=".27"/></feComponentTransfer>
        </filter>
        <filter id="creepf" x="-20%" y="-20%" width="140%" height="140%"><feTurbulence type="fractalNoise" baseFrequency=".02" numOctaves="3" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="70"/></filter>
      </defs>

      <g id="world">
        <rect x="-30" y="-30" width="1460" height="400" filter="url(#terrain)"/>
        <rect x="-30" y="-30" width="1460" height="400" fill="url(#tiles)"/>
        <g fill="none" stroke="#9b7b10" stroke-width="2" stroke-dasharray="12 9" opacity=".6">
          <path d="M880 340L1180 150"/><path d="M640 300L900 128"/><path d="M360 330L610 170"/><path d="M1000 340L1090 290"/>
        </g>
        <g fill="#000" opacity=".35"><ellipse cx="760" cy="250" rx="46" ry="14"/><ellipse cx="560" cy="300" rx="38" ry="11"/><ellipse cx="930" cy="296" rx="30" ry="9"/><ellipse cx="470" cy="215" rx="34" ry="10"/></g>
        <g filter="url(#creepf)"><ellipse cx="170" cy="200" rx="360" ry="210" fill="url(#creep)"/></g>
        <g id="minerals"></g>
        <g id="decals"></g>
        <g id="zstruct"></g>
        <g id="scvs"></g>
        <g id="structs"></g>
        <g id="units"></g>
        <g id="fx"></g>
        <g id="weld" opacity="0">
          <line id="scan" stroke="#4ec9ff" stroke-width="1.8" filter="url(#glow)"/>
          <g id="sparks"></g><g id="builder"></g>
          <g id="pbar"><rect x="-26" y="-3" width="52" height="6" fill="#02080c" stroke="#3b5163"/><rect id="pfill" x="-25" y="-2" width="0" height="4" fill="#6dff7a"/></g>
        </g>
      </g>
    </svg>
    <div class="vignette"></div><div class="grain"></div>
    <div class="clock"><div class="time" id="time">00:00<span class="cs">.00</span></div></div>
    <div class="hud-l" id="hudl">CH.<b>01</b> · 처치 <b>00</b></div>
    <div class="res">
      <span><svg viewBox="0 0 16 16"><path d="M8 0 L14 5 L11.5 16 L4.5 16 L2 5Z" fill="#59c7ff"/><path d="M8 0V16" stroke="#0b2833"/></svg><b id="min">50</b></span>
      <span><svg viewBox="0 0 16 16"><rect x="3" y="1" width="10" height="14" rx="3" fill="#6dff7a"/><rect x="5" y="4" width="6" height="3" fill="#06210e"/></svg><b id="gas">0</b></span>
      <span id="supw"><svg viewBox="0 0 16 16"><circle cx="8" cy="5" r="3.2" fill="#59c7ff"/><path d="M2 15c0-4 3-6 6-6s6 2 6 6z" fill="#59c7ff"/></svg><b id="sup">6/15</b></span>
    </div>
    <div class="msgs" id="msgs"></div>
    <div class="alert" id="alert"></div>
    <div class="flash" id="flash"></div>
    <div class="bar t" id="bt"></div><div class="bar b" id="bb"></div>
    <div class="title" id="title"><small id="tch">CHAPTER 01</small><b>전선 사수</b><i>TERRAN · OPERATION FRONTLINE</i></div>
  </div>

  <div class="console">
    <div class="mmwrap">
      <div class="mmbtns"><div><svg viewBox="0 0 24 12"><path d="M1 11L8 2l5 6 3-3 7 6z" fill="#ffd23a"/></svg></div><div></div></div>
      <div class="well mm">
        <svg viewBox="0 0 100 100" id="mmsvg" preserveAspectRatio="none">
          <rect width="100" height="100" fill="#03080a"/>
          <rect x="3" y="30" width="94" height="40" fill="#0a1512"/>
          <ellipse cx="14" cy="50" rx="22" ry="18" fill="#2a1638" opacity=".9"/>
          <g id="mmd"></g>
          <rect id="mmcam" y="30" width="43" height="40" fill="none" stroke="#fff" stroke-width=".8"/>
        </svg>
      </div>
    </div>

    <div class="info well">
      <div class="sel" id="sel"></div>
      <div class="nfo">
        <div class="nm" id="nm">테란 SCV</div>
        <div class="st" id="st">대기 중</div>
        <div class="seg" id="seg"></div>
        <div class="slots" id="slots"></div>
      </div>
    </div>

    <div class="portwrap">
      <div class="menu">메뉴</div>
      <div class="well portrait">
        <svg viewBox="0 0 100 100" id="face">
          <defs><radialGradient id="pb" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#3b3328"/><stop offset="1" stop-color="#0a0806"/></radialGradient></defs>
          <rect width="100" height="100" fill="url(#pb)"/>
          <path d="M8 100c2-24 18-32 42-32s40 8 42 32z" fill="#3a5aa8"/>
          <path d="M30 62c0-26 8-44 20-44s20 18 20 44c0 12-8 20-20 20S30 74 30 62z" fill="#c79a74"/>
          <path d="M26 46c0-22 10-34 24-34s24 12 24 34c-6-8-14-12-24-12s-18 4-24 12z" fill="#8c98a8"/>
          <rect x="32" y="44" width="14" height="6" rx="2" fill="#1a1410"/><rect x="54" y="44" width="14" height="6" rx="2" fill="#1a1410"/>
          <circle cx="39" cy="47" r="1.6" fill="#f5e6c0"/><circle cx="61" cy="47" r="1.6" fill="#f5e6c0"/>
          <path d="M38 70c4 5 20 5 24 0" stroke="#5a3a28" stroke-width="2.4" fill="none"/><path d="M36 64c6 8 22 8 28 0v8c-6 10-22 10-28 0z" fill="#6b4a36" opacity=".55"/>
        </svg>
      </div>
    </div>

    <div class="cmdwrap">
      <div class="cmd">
        <button id="go" title="시작 / 정지 (Space)"><svg id="goi" viewBox="0 0 24 24"></svg><span class="lb" id="gol">시작</span><span class="k">␣</span></button>
        <button id="lap" disabled title="랩 (L)"><svg viewBox="0 0 24 24"><path d="M6 21V3M6 4h12l-3 4 3 4H6" fill="none" stroke="#ffa800" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg><span class="lb">랩</span><span class="k">L</span></button>
        <button id="rst" disabled title="초기화 (R)"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5" fill="none" stroke="#ffa800" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="lb">초기화</span><span class="k">R</span></button>
        <button id="sfx" title="사운드 (M)"><svg id="sfxi" viewBox="0 0 24 24"></svg><span class="lb">소리</span><span class="k">M</span></button>
        <button id="fs" title="전체화면 (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="#ffa800" stroke-width="2.4" stroke-linecap="round"/><rect x="9" y="9" width="6" height="6" fill="none" stroke="#ffa800" stroke-width="1.6" stroke-dasharray="2 2"/></svg><span class="lb">전체화면</span><span class="k">F</span></button>
        <div class="slot x1"></div><div class="slot"></div><div class="slot"></div><div class="slot"></div>
      </div>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
const pad = (n, l = 2) => String(n).padStart(l, '0');
const clamp = v => Math.max(0, Math.min(1, v));
const clampR = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;

const st = document.createElement('style'); st.textContent = '@keyframes fl{0%{opacity:.8}100%{opacity:0}}'; document.head.appendChild(st);

/* ============================================================

const ICON_GO = '<circle cx="12" cy="12" r="9.5" fill="none" stroke="#ffa800" stroke-width="2.4"/><path d="M6.5 12h10M12.5 7.5l5 4.5-5 4.5" fill="none" stroke="#ffa800" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>';
const ICON_STOP = '<circle cx="12" cy="12" r="9.5" fill="none" stroke="#ffa800" stroke-width="2.4"/><path d="M7.5 7.5l9 9M16.5 7.5l-9 9" stroke="#ffa800" stroke-width="2.4" stroke-linecap="round"/>';
const SPK_ON = '<path d="M3 9v6h4l5 4V5L7 9zM16 8c2 2 2 6 0 8M19 5c4 4 4 10 0 14" fill="none" stroke="#ffa800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
const SPK_OFF = '<path d="M3 9v6h4l5 4V5L7 9zM16 9l5 6M21 9l-5 6" fill="none" stroke="#7f6a3a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>';
$('goi').innerHTML = ICON_GO; $('sfxi').innerHTML = SPK_ON;
function loop() { elapsed = performance.now() - base; render(); raf = requestAnimationFrame(loop); }
function toggle() {
  if (running) { running = false; cancelAnimationFrame(raf); elapsed = performance.now() - base; render(); $('goi').innerHTML = ICON_GO; $('gol').textContent = '계속'; beep(330, .08); }
  else { running = true; base = performance.now() - elapsed; prevSec = (elapsed / 1000) % 60; raf = requestAnimationFrame(loop); $('goi').innerHTML = ICON_STOP; $('gol').textContent = '정지';
    $('lap').disabled = $('rst').disabled = false; beep(880, .07); if (elapsed === 0) addMsg(SUBS[0][1]); try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {} }
}
function lap() { if (!running) return; const prev = laps.length ? laps[laps.length - 1] : 0; laps.push(elapsed); beep(1200, .04); addMsg(`웨이포인트 ${pad(laps.length)}`, `${fmtT(elapsed)} (+${fmtT(elapsed - prev)})`); }
